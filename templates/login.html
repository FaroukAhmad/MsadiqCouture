{% extends 'base.html' %}
{% block title %}Login | Msadiq Couture{% endblock %}
{% block content %}
<section class="section auth-section">
  <div class="container auth-form-shell">
    <div class="auth-intro">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Msadiq Couture logo" />
      <h1>Welcome back</h1>
      <p>Access your tailoring dashboard, bookings, measurements, and order updates.</p>
    </div>
    <form class="auth-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="next" value="{{ next_url }}" />
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com" required />
      </label>
      <label>
        Password
        <input type="password" name="password" placeholder="Enter your password" required />
      </label>
      <button type="submit" class="btn btn-primary full-width">Login</button>
      <p class="auth-note">New to Msadiq Couture? <a class="text-link" href="{{ url_for('signup', next=next_url) if next_url else url_for('signup') }}">Create an account</a></p>
    </form>
  </div>
</section>
{% endblock %}
